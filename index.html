<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitwise Operation Unit</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --panel: #13151c;
  --surface: #1a1d27;
  --surface2: #21263a;
  --border: #2a2f45;
  --border2: #363d58;
  --accent: #4f8ef7;
  --accent2: #7c3aed;
  --green: #22d3a0;
  --amber: #f59e0b;
  --red: #f43f5e;
  --purple: #a78bfa;
  --text: #e8eaf2;
  --text2: #8b91b0;
  --text3: #555c7a;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Space Grotesk', sans-serif;
  --radius: 8px;
  --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

/* LAYOUT */
.app { 
  display: grid; 
  grid-template-columns: 280px 1fr; 
  height: 100vh; 
}

/* LEFT PANEL */
.left-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel); overflow: hidden; }
.panel-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.panel-section + .panel-section { border-top: 1px solid var(--border); }
.panel-header { padding: 12px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.panel-header-icon { width: 6px; height: 6px; border-radius: 50%; }
.panel-header h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); }
.panel-body { flex: 1; overflow-y: auto; padding: 10px; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }

/* OPERATORS PANEL */
.op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.op-chip { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; cursor: grab; user-select: none; transition: border-color 0.15s, background 0.15s, transform 0.1s; display: flex; flex-direction: column; gap: 3px; }
.op-chip:hover { border-color: var(--border2); background: var(--surface2); transform: translateY(-1px); }
.op-chip:active { cursor: grabbing; transform: scale(0.96); }
.op-chip.dragging-source { opacity: 0.4; }
.op-chip.selected-active { border-color: var(--accent); background: var(--surface2); box-shadow: 0 0 0 2px rgba(79, 142, 247, 0.3); }
.op-chip .op-sym { font-family: var(--mono); font-size: 16px; font-weight: 700; }
.op-chip .op-name { font-size: 10px; color: var(--text3); }
.op-AND .op-sym { color: var(--accent); }
.op-OR .op-sym { color: var(--green); }
.op-XOR .op-sym { color: var(--purple); }
.op-NOT .op-sym { color: var(--amber); }
.op-SHL .op-sym { color: var(--red); }
.op-SHR .op-sym { color: var(--red); }
.op-NAND .op-sym { color: var(--accent); }
.op-NOR .op-sym { color: var(--green); }
.op-XNOR .op-sym { color: var(--purple); }

/* VARIABLES PANEL */
.var-list { display: flex; flex-direction: column; gap: 6px; }
.var-chip { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; cursor: grab; user-select: none; transition: border-color 0.15s, background 0.15s; display: flex; align-items: center; gap: 8px; }
.var-chip:hover { border-color: var(--border2); background: var(--surface2); }
.var-chip:active { cursor: grabbing; }
.var-chip.dragging-source { opacity: 0.4; }
.var-chip.selected-active { border-color: var(--green); background: var(--surface2); box-shadow: 0 0 0 2px rgba(34, 211, 160, 0.3); }
.var-badge { font-size: 10px; font-weight: 700; font-family: var(--mono); padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
.var-info { flex: 1; min-width: 0; }
.var-bits-preview { font-family: var(--mono); font-size: 10px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.var-dec { font-family: var(--mono); font-size: 11px; color: var(--text3); }
.var-delete { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 2px; line-height: 1; flex-shrink: 0; }
.var-delete:hover { color: var(--red); }
.var-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 20px 10px; line-height: 1.6; }

/* MAIN CANVAS */
.main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; flex: 1 1 0%; }
.toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; background: var(--panel); }
.toolbar-title { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; margin-right: auto; }
.btn { padding: 8px 14px; border-radius: var(--radius); font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid; transition: all 0.15s; white-space: nowrap; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #6b9ff8; }
.btn-ghost { background: transparent; border-color: var(--border2); color: var(--text2); }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-vars-toggle { display: none; }

.canvas-scroll { flex: 1 1 0%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }

/* desktop canvas-area is just a transparent passthrough */
.canvas-area { display: flex; flex-direction: row; flex: 1 1 0%; min-height: 0; overflow: hidden; }

/* CALC BLOCK */
.calc-block { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: border-color 0.2s; flex-shrink: 0; }
.calc-block:hover { border-color: var(--border2); }
.calc-block.interlink-error { border-color: var(--red) !important; box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.4) !important; }

/* inner row: main content + desktop remarks side by side */
.calc-inner { display: flex; flex-direction: row; min-width: 0; }
.calc-main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.calc-ribbon { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
.ribbon-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
.ribbon-spacer { flex: 1; }
.bits-ctrl { display: flex; align-items: center; gap: 6px; }
.bits-ctrl label { font-size: 10px; color: var(--text3); }
.bits-slider { width: 80px; accent-color: var(--accent); cursor: pointer; }
.bits-val { font-family: var(--mono); font-size: 11px; color: var(--text2); min-width: 20px; }
.ribbon-del { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
.ribbon-del:hover { color: var(--red); }

.calc-body { padding: 14px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; }

.calc-slot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--text3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.slot-promote-btn { font-size: 9px; padding: 2px 6px; border-radius: 3px; background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; font-family: var(--sans); font-weight: 600; transition: all 0.12s; }
.slot-promote-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.slot-dec { font-family: var(--mono); font-size: 11px; color: var(--text2); }
.slot-var-name { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
.slot-var-name.draggable-result-label { cursor: grab; user-select: none; }
.slot-var-name.draggable-result-label:active { cursor: grabbing; }

.bit-strip { display: flex; flex-wrap: wrap; gap: 4px; min-height: 32px; }
.bit-cell { width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-family: var(--mono); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.1s, border-color 0.1s, color 0.1s; user-select: none; }
.bit-cell.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.bit-cell.result-bit { cursor: default; }
.bit-cell.result-bit.on { background: var(--green); border-color: var(--green); color: #0d0f14; }

/* ── OPERATOR DROP ZONE + INLINE DROPDOWN ─────────────────────────────── */
.op-drop-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 80px; width: 75px; align-self: center; position: relative; }
.op-placed { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; text-align: center; transition: border-color 0.15s; width: 100%; }
.op-placed:hover { border-color: var(--red); }
.op-placed .op-sym { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.op-placed .op-clear { font-size: 9px; color: var(--text3); white-space: nowrap; }
.op-dropzone-empty { width: 100%; min-height: 70px; border: 1.5px dashed var(--border2); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text3); transition: border-color 0.15s, background 0.15s; text-align: center; cursor: pointer; gap: 4px; padding: 6px; }
.op-dropzone-empty .dz-hint { font-size: 9px; opacity: 0.6; }
.op-dropzone-empty.drag-over, .op-dropzone-empty.waiting-tap { border-color: var(--accent); background: rgba(79,142,247,0.08); color: var(--accent); }

/* operator inline dropdown — portal: appended to body, position:fixed */
.op-inline-dropdown {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  z-index: 9999;
  min-width: 150px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  overflow-y: auto;
  max-height: 70vh;
  animation: ddDropIn 0.13s ease;
}
@keyframes ddDropIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.op-inline-dropdown .dd-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
  white-space: nowrap;
}
.op-inline-dropdown .dd-item:last-child { border-bottom: none; }
.op-inline-dropdown .dd-item:hover, .op-inline-dropdown .dd-item:active { background: var(--surface2); }
.op-inline-dropdown .dd-sym { font-family: var(--mono); font-size: 14px; font-weight: 700; min-width: 22px; }
.op-inline-dropdown .dd-lbl { color: var(--text2); }

.slot-dropzone { min-height: 36px; border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 4px; transition: border-color 0.15s, background 0.15s; cursor: pointer; }
.slot-dropzone.has-var { border-color: var(--border2); cursor: default; }
.slot-dropzone.drag-over, .slot-dropzone.waiting-tap { border-color: var(--accent); background: rgba(79,142,247,0.08); }

.result-section { padding: 0 14px 14px; border-top: 1px solid var(--border); margin-top: 4px; }
.result-row { display: flex; align-items: center; gap: 12px; padding-top: 12px; flex-wrap: wrap; }
.result-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--text3); }
.result-dec { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--green); }
.result-hex { font-family: var(--mono); font-size: 11px; color: var(--text2); }
.result-incomplete { font-family: var(--mono); font-size: 11px; color: var(--text3); }

/* ── REMARKS PANEL — DESKTOP (right column) ─────────────────────────────── */
.remarks-col {
  width: 190px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
}
.remarks-toggle-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 10px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s, border-color 0.15s;
  flex-shrink: 0;
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  width: 100%;
  text-align: left;
  color: inherit;
  font-family: var(--sans);
}
.remarks-toggle-btn:hover { background: var(--surface2); }
.remarks-toggle-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text2);
  flex: 1;
}
.remarks-chevron {
  font-size: 12px;
  color: var(--text3);
  transition: transform 0.2s;
  flex-shrink: 0;
}
/* desktop col open state */
.remarks-col.open .remarks-toggle-btn { border-bottom-color: var(--border); }
.remarks-col.open .remarks-chevron { transform: rotate(180deg); }
/* mobile panel open state */
.remarks-mobile.open .remarks-toggle-btn { border-bottom-color: var(--border); }
.remarks-mobile.open .remarks-chevron { transform: rotate(180deg); }

.remarks-body {
  display: none;
  flex-direction: column;
  padding: 8px;
  flex: 1;
}
/* body visible when EITHER desktop col OR mobile panel is open */
.remarks-col.open .remarks-body,
.remarks-mobile.open .remarks-body { display: flex; }

.remarks-textarea {
  flex: 1;
  min-height: 80px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.5;
  padding: 8px;
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
.remarks-textarea::placeholder { color: var(--text3); }
.remarks-textarea:focus { border-color: var(--accent); }

/* ── REMARKS PANEL — MOBILE (bottom of block) ───────────────────────────── */
.remarks-mobile {
  display: none;          /* hidden on desktop; shown via media query */
  flex-direction: column;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.remarks-mobile .remarks-body { padding: 8px; }
.remarks-mobile .remarks-textarea { min-height: 80px; }

.no-ops { font-size: 12px; color: var(--text3); text-align: center; padding: 40px 20px; line-height: 1.8; }

/* ── MOBILE VARIABLES COLLAPSIBLE SIDEBAR ───────────────────────────────
   Sits beside .canvas-scroll in a flex row — no overlay, no blur,
   canvas stays fully interactive even when sidebar is open.           */
.mobile-vars-sidebar {
  display: none; /* shown only in mobile media query */
  flex-direction: column;
  width: 0;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--panel);
  border-left: 1px solid var(--border);
  transition: width 0.22s cubic-bezier(0.4,0,0.2,1);
}
.mobile-vars-sidebar.open {
  width: 200px;
}
.mobile-vars-sidebar-inner {
  width: 200px; /* fixed inner width; outer clips it */
  display: flex;
  flex-direction: column;
  height: 100%;
}
.mvs-header {
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.mvs-header h3 {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); flex: 1;
}
.mvs-close {
  background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; line-height: 1; padding: 0;
}
.mvs-close:hover { color: var(--text); }
.mvs-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}

/* ── RESPONSIVE ──────────────────────────────────────────────────────────── */
@media (max-width: 850px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;   /* full height, no top panel row */
    height: 100vh;
    overflow: hidden;
  }

  /* completely remove the left panel (operators + vars) from mobile */
  .left-panel { display: none !important; }

  /* show vars toggle button in toolbar */
  .btn-vars-toggle { display: flex !important; }

  /* desktop remarks col → hidden; mobile remarks shown */
  .remarks-col { display: none !important; }
  .remarks-mobile { display: flex; }

  /* .main becomes a column: toolbar on top, then a flex-row of canvas + vars sidebar */
  .main { flex-direction: column; }

  /* canvas-area: flex row so vars sidebar slides in beside it */
  .canvas-area {
    display: flex;
    flex-direction: row;
    flex: 1 1 0%;
    min-height: 0;
    overflow: hidden;
  }

  .canvas-scroll { flex: 1 1 0%; padding: 12px; gap: 12px; overflow-y: auto; }

  /* show the mobile vars sidebar element */
  .mobile-vars-sidebar { display: flex; }

  .calc-body {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    gap: 12px;
  }

  .op-drop-zone {
    width: 100%;
    min-height: auto;
    height: 52px;
    flex-direction: row;
  }

  .op-placed {
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .op-placed .op-sym { font-size: 15px; }
  .op-dropzone-empty { min-height: 38px; font-size: 11px; }
}

@media (max-width: 480px) {
  .toolbar-title { font-size: 11px; }
  .btn { padding: 6px 10px; font-size: 11px; }
  .bit-cell { width: 24px; height: 24px; font-size: 10px; }
  .mobile-vars-sidebar.open { width: 160px; }
  .mobile-vars-sidebar-inner { width: 160px; }
}

/* VAR COLORS */
.vc-0 { background: rgba(79,142,247,0.15); color: #4f8ef7; border-color: rgba(79,142,247,0.3); }
.vc-1 { background: rgba(34,211,160,0.15); color: #22d3a0; border-color: rgba(34,211,160,0.3); }
.vc-2 { background: rgba(167,139,250,0.15); color: #a78bfa; border-color: rgba(167,139,250,0.3); }
.vc-3 { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
.vc-4 { background: rgba(244,63,94,0.15); color: #f43f5e; border-color: rgba(244,63,94,0.3); }
.vc-5 { background: rgba(124,58,237,0.15); color: #7c3aed; border-color: rgba(124,58,237,0.3); }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="panel-section" style="flex: 1 1 auto;">
      <div class="panel-header">
        <div class="panel-header-icon" style="background:#4f8ef7"></div>
        <h3>Operators</h3>
      </div>
      <div class="panel-body">
        <div class="op-grid" id="op-grid">
          <div class="op-chip op-AND" draggable="true" data-op="AND"><span class="op-sym">&amp;</span><span class="op-name">AND</span></div>
          <div class="op-chip op-OR" draggable="true" data-op="OR"><span class="op-sym">|</span><span class="op-name">OR</span></div>
          <div class="op-chip op-XOR" draggable="true" data-op="XOR"><span class="op-sym">^</span><span class="op-name">XOR</span></div>
          <div class="op-chip op-NOT" draggable="true" data-op="NOT"><span class="op-sym">~</span><span class="op-name">NOT (unary)</span></div>
          <div class="op-chip op-NAND" draggable="true" data-op="NAND"><span class="op-sym">~&amp;</span><span class="op-name">NAND</span></div>
          <div class="op-chip op-NOR" draggable="true" data-op="NOR"><span class="op-sym">~|</span><span class="op-name">NOR</span></div>
          <div class="op-chip op-XNOR" draggable="true" data-op="XNOR"><span class="op-sym">~^</span><span class="op-name">XNOR</span></div>
          <div class="op-chip op-SHL" draggable="true" data-op="SHL"><span class="op-sym">&lt;&lt;</span><span class="op-name">Shift Left</span></div>
          <div class="op-chip op-SHR" draggable="true" data-op="SHR"><span class="op-sym">&gt;&gt;</span><span class="op-name">Shift Right</span></div>
        </div>
      </div>
    </div>
    <!-- Desktop-only variables section -->
    <div class="panel-section vars-panel">
      <div class="panel-header">
        <div class="panel-header-icon" style="background:#22d3a0"></div>
        <h3>Variables</h3>
        <span style="font-size:10px;color:var(--text3);margin-left:auto">drag/tap →</span>
      </div>
      <div class="panel-body">
        <div class="var-list" id="var-list-desktop"></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <span class="toolbar-title">BITWISE OPERATION UNIT</span>
      <button class="btn btn-ghost btn-vars-toggle" id="vars-toggle-btn" onclick="toggleVarsSidebar()">⊞ vars</button>
      <button class="btn btn-ghost" onclick="clearAll()">clear all</button>
      <button class="btn btn-primary" onclick="addBlock()">+ operation</button>
    </div>
    <!-- canvas-area: flex row — canvas + vars sidebar sit side by side, no overlay -->
    <div class="canvas-area">
      <div class="canvas-scroll" id="canvas">
        <div class="no-ops" id="no-ops">
          Click <b>+ operation</b> to start,<br>then tap the ⊕ to pick an operator
        </div>
      </div>
      <!-- Mobile vars sidebar — inline, no overlay, no blur -->
      <div class="mobile-vars-sidebar" id="mobile-vars-sidebar">
        <div class="mobile-vars-sidebar-inner">
          <div class="mvs-header">
            <div class="panel-header-icon" style="background:#22d3a0"></div>
            <h3>Variables</h3>
            <button class="mvs-close" onclick="toggleVarsSidebar()">×</button>
          </div>
          <div class="mvs-body">
            <div class="var-list" id="var-list-mobile"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────
let blocks = [];
let variables = {};
let varCounter = 0;
let blockCounter = 0;
let dragPayload = null;
let tapPayload = null;
const nameCounters = {};
const blockRemarks = {}; // { blockId: text, blockId+'_d': bool, blockId+'_m': bool }

const VAR_COLORS = ['vc-0','vc-1','vc-2','vc-3','vc-4','vc-5'];
function varColor(id) {
  const keys = Object.keys(variables);
  const idx = keys.indexOf(id);
  return VAR_COLORS[idx % VAR_COLORS.length];
}

// ── OPERATORS ──────────────────────────────────────────────────────────
const OP_META = {
  AND:  { sym: '&',   label: 'AND',        unary: false },
  OR:   { sym: '|',   label: 'OR',         unary: false },
  XOR:  { sym: '^',   label: 'XOR',        unary: false },
  NOT:  { sym: '~',   label: 'NOT',        unary: true  },
  NAND: { sym: '~&',  label: 'NAND',       unary: false },
  NOR:  { sym: '~|',  label: 'NOR',        unary: false },
  XNOR: { sym: '~^',  label: 'XNOR',       unary: false },
  SHL:  { sym: '<<',  label: 'Shift Left',  unary: false },
  SHR:  { sym: '>>',  label: 'Shift Right', unary: false },
};

function opColor(op) {
  const map = { AND:'#4f8ef7', OR:'#22d3a0', XOR:'#a78bfa', NOT:'#f59e0b', NAND:'#4f8ef7', NOR:'#22d3a0', XNOR:'#a78bfa', SHL:'#f43f5e', SHR:'#f43f5e' };
  return map[op] || '#8b91b0';
}

// ── COMPUTE ─────────────────────────────────────────────────────────────
function computeOp(op, a, b, bits) {
  const mask = (bits >= 32) ? 0xFFFFFFFF : (1 << bits) - 1;
  let r;
  switch(op) {
    case 'AND':  r = (a & b); break;
    case 'OR':   r = (a | b); break;
    case 'XOR':  r = (a ^ b); break;
    case 'NOT':  r = (~a) & mask; break;
    case 'NAND': r = ~(a & b) & mask; break;
    case 'NOR':  r = ~(a | b) & mask; break;
    case 'XNOR': r = ~(a ^ b) & mask; break;
    case 'SHL':  r = (a << (b % bits)) & mask; break;
    case 'SHR':  r = (a >>> (b % bits)) & mask; break;
    default: return null;
  }
  return r & mask;
}

// ── BLOCK DATA ──────────────────────────────────────────────────────────
function makeBlock(op) {
  const id = 'blk_' + (++blockCounter);
  const meta = OP_META[op] || OP_META['AND'];
  const block = {
    id, op,
    bits: 8,
    aVal: 0, aVarId: null,
    bVal: 0, bVarId: null,
    resultVarId: null,
    unary: meta ? meta.unary : false,
  };
  blocks.push(block);
  return block;
}

function getSlotValue(block, slot) {
  if (slot === 'a') return block.aVarId ? (variables[block.aVarId]?.value ?? 0) : block.aVal;
  if (slot === 'b') return block.bVarId ? (variables[block.bVarId]?.value ?? 0) : block.bVal;
  return 0;
}

function getResult(block) {
  if (!block.op) return null;
  const meta = OP_META[block.op];
  if (!meta) return null;
  const a = getSlotValue(block, 'a');
  const b = meta.unary ? 0 : getSlotValue(block, 'b');
  return computeOp(block.op, a, b, block.bits);
}

// ── VARIABLES ───────────────────────────────────────────────────────────
function makeVar(baseName, value, bits) {
  const id = 'var_' + (++varCounter);
  nameCounters[baseName] = (nameCounters[baseName] || 0) + 1;
  const name = nameCounters[baseName] === 1 ? baseName : baseName + nameCounters[baseName];
  variables[id] = { id, name, value, bits };
  renderVarPanel();
  return id;
}

function promoteSlot(blockId, slot) {
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;
  let val, bits, srcLabel;
  if (slot === 'result') {
    val = getResult(block);
    if (val === null) return;
    bits = block.bits;
    srcLabel = 'R' + blockId.replace('blk_','');
  } else {
    val = getSlotValue(block, slot);
    bits = block.bits;
    srcLabel = slot.toUpperCase() + blockId.replace('blk_','');
  }
  const vid = makeVar(srcLabel, val, bits);
  if (slot === 'a') block.aVarId = vid;
  else if (slot === 'b') block.bVarId = vid;
  else if (slot === 'result') block.resultVarId = vid;
  dragPayload = null;
  clearTapSelection();
  renderBlock(block);
  renderVarPanel();
}

function deleteVar(varId) {
  if (tapPayload && tapPayload.type === 'var' && tapPayload.varId === varId) clearTapSelection();
  delete variables[varId];
  blocks.forEach(b => {
    if (b.aVarId === varId) b.aVarId = null;
    if (b.bVarId === varId) b.bVarId = null;
    if (b.resultVarId === varId) b.resultVarId = null;
    renderBlock(b);
  });
  renderVarPanel();
}

function updateResultVar(block) {
  if (block.resultVarId && variables[block.resultVarId]) {
    const r = getResult(block);
    if (r !== null) {
      variables[block.resultVarId].value = r;
      variables[block.resultVarId].bits = block.bits;
      renderVarPanel();
      blocks.forEach(b => {
        if (b.id !== block.id && (b.aVarId === block.resultVarId || b.bVarId === block.resultVarId)) {
          redrawSlotBits(b, 'a');
          redrawSlotBits(b, 'b');
          redrawResult(b);
        }
      });
    }
  }
}

// ── BITS HELPERS ────────────────────────────────────────────────────────
function valToBits(val, bits) {
  const arr = [];
  for (let i = bits - 1; i >= 0; i--) arr.push((val >> i) & 1);
  return arr;
}

// ── RENDER VAR PANEL (both desktop list + mobile drawer list) ────────────
function attachVarChipEvents(el, vid) {
  el.querySelector('[data-delete-var]').addEventListener('click', e => {
    e.stopPropagation();
    deleteVar(vid);
  });
  el.addEventListener('dragstart', e => {
    clearTapSelection();
    dragPayload = { type: 'var', varId: vid };
    el.classList.add('dragging-source');
    e.dataTransfer.effectAllowed = 'copy';
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging-source'));
  el.addEventListener('click', e => {
    e.stopPropagation();
    handleMobileTapSelection({ type: 'var', varId: vid }, el);
  });
}

function renderVarPanel() {
  ['var-list-desktop', 'var-list-mobile'].forEach(listId => {
    const list = document.getElementById(listId);
    if (!list) return;
    const keys = Object.keys(variables);
    list.innerHTML = '';
    if (!keys.length) {
      list.innerHTML = '<div class="var-empty">Promote bits from slots<br>to map variables</div>';
      return;
    }
    keys.forEach(vid => {
      const v = variables[vid];
      const vc = varColor(vid);
      const bitsStr = valToBits(v.value, v.bits).join('');
      const el = document.createElement('div');
      el.className = 'var-chip';
      if (tapPayload && tapPayload.type === 'var' && tapPayload.varId === vid) el.classList.add('selected-active');
      el.draggable = true;
      el.dataset.varId = vid;
      el.innerHTML = `
        <span class="var-badge ${vc}">${v.name}</span>
        <div class="var-info">
          <div class="var-bits-preview">${bitsStr}</div>
          <div class="var-dec">${v.value} · 0x${v.value.toString(16).toUpperCase().padStart(Math.ceil(v.bits/4),'0')}</div>
        </div>
        <button class="var-delete" title="delete" data-delete-var="${vid}">×</button>
      `;
      attachVarChipEvents(el, vid);
      list.appendChild(el);
    });
  });
}

// ── BUILD SLOT HTML ─────────────────────────────────────────────────────
function buildSlotHTML(block, slot, label) {
  const val = getSlotValue(block, slot);
  const varId = slot === 'a' ? block.aVarId : block.bVarId;
  const vc = varId ? varColor(varId) : '';
  const vName = varId ? (variables[varId]?.name || '??') : '';
  const bitsHTML = valToBits(val, block.bits).map((b, i) => {
    const pos = block.bits - 1 - i;
    return `<div class="bit-cell ${b?'on':''}" onclick="toggleBit(event,'${block.id}','${slot}',${pos})">${b}</div>`;
  }).join('');
  const hexStr = val.toString(16).toUpperCase().padStart(Math.ceil(block.bits/4),'0');
  const isWaitingVar = tapPayload && tapPayload.type === 'var';
  return `
    <div class="calc-slot">
      <div class="slot-label" style="display:flex;align-items:center;justify-content:space-between;width:100%">
        <div style="display:flex;align-items:center;gap:6px;min-width:0">
          <span>${label}</span>
          ${varId ? `<span class="slot-var-name ${vc}" title="${vName}">${vName}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          ${varId ? `<button class="slot-promote-btn" style="color:var(--red);border-color:rgba(244,63,94,0.2)" onclick="unlinkVar(event,'${block.id}','${slot}')" title="Unlink">×</button>` : ''}
          <button class="slot-promote-btn" onclick="promoteSlot('${block.id}','${slot}')">↑ promote</button>
        </div>
      </div>
      <div class="slot-dropzone ${varId?'has-var':''} ${isWaitingVar&&!varId?'waiting-tap':''}" id="${block.id}_${slot}_zone"
        ondragover="slotDragOver(event,'${block.id}','${slot}')"
        ondragleave="slotDragLeave(event,'${block.id}','${slot}')"
        ondrop="slotDrop(event,'${block.id}','${slot}')"
        onclick="handleSlotTap('${block.id}','${slot}')">
        <div class="bit-strip">${bitsHTML}</div>
      </div>
      <div class="slot-dec">${val} · 0x${hexStr}</div>
    </div>`;
}

function unlinkVar(e, blockId, slot) {
  if (e) e.stopPropagation();
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;
  if (slot === 'a') block.aVarId = null;
  else if (slot === 'b') block.bVarId = null;
  else if (slot === 'result') block.resultVarId = null;
  dragPayload = null;
  clearTapSelection();
  renderBlock(block);
}

// ── FLASH ERROR ─────────────────────────────────────────────────────────
function flashInterlinkError(blockId) {
  const el = document.getElementById(blockId);
  if (!el) return;
  el.classList.add('interlink-error');
  setTimeout(() => el.classList.remove('interlink-error'), 500);
}

function slotDrop(e, blockId, slot) {
  e.preventDefault(); e.stopPropagation();
  document.getElementById(blockId + '_' + slot + '_zone')?.classList.remove('drag-over');
  const currentPayload = dragPayload || tapPayload;
  if (!currentPayload || currentPayload.type !== 'var') return;
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;
  const vid = currentPayload.varId;
  if (!variables[vid]) return;
  if (block.resultVarId === vid) { flashInterlinkError(blockId); dragPayload = null; clearTapSelection(); return; }
  if (slot === 'a') { block.aVarId = vid; block.aVal = variables[vid].value; }
  else { block.bVarId = vid; block.bVal = variables[vid].value; }
  dragPayload = null;
  clearTapSelection();
  renderBlock(block);
}

// ── OPERATOR INLINE DROPDOWN (body portal) ───────────────────────────────
let activeDropdown = null;

function openOpDropdown(blockId) {
  if (tapPayload && tapPayload.type === 'op') {
    handleOpZoneTap(blockId);
    return;
  }
  closeOpDropdown();
  const opZone = document.querySelector(`#${blockId}_op_zone`);
  if (!opZone) return;
  const dzEmpty = opZone.querySelector('.op-dropzone-empty');
  if (!dzEmpty) return; // op already placed

  const dd = document.createElement('div');
  dd.className = 'op-inline-dropdown';
  dd.id = 'dd_' + blockId;

  Object.entries(OP_META).forEach(([op, meta]) => {
    const item = document.createElement('div');
    item.className = 'dd-item';
    item.innerHTML = `<span class="dd-sym" style="color:${opColor(op)}">${meta.sym}</span><span class="dd-lbl">${meta.label}</span>`;
    const pickOp = (e) => {
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();
      const block = blocks.find(b => b.id === blockId);
      if (block) { block.op = op; block.unary = meta.unary; }
      closeOpDropdown();
      if (block) renderBlock(block);
    };
    item.addEventListener('mousedown', pickOp);
    item.addEventListener('touchend', pickOp, { passive: false });
    dd.appendChild(item);
  });

  // Portal: attach to body so no parent overflow can clip it
  document.body.appendChild(dd);
  activeDropdown = blockId;

  // Position using trigger's viewport rect
  const rect = dzEmpty.getBoundingClientRect();
  const ddH = Math.min(dd.scrollHeight, window.innerHeight * 0.7);
  const spaceBelow = window.innerHeight - rect.bottom;
  const spaceAbove = rect.top;

  let top;
  if (spaceBelow >= ddH || spaceBelow >= spaceAbove) {
    // open downward
    top = rect.bottom + 6;
  } else {
    // open upward
    top = rect.top - ddH - 6;
  }

  // center horizontally on trigger, keep within viewport
  let left = rect.left + rect.width / 2 - 75; // 75 = half of min-width 150
  left = Math.max(8, Math.min(left, window.innerWidth - 158));

  dd.style.top = top + 'px';
  dd.style.left = left + 'px';
}

function closeOpDropdown() {
  if (activeDropdown) {
    document.getElementById('dd_' + activeDropdown)?.remove();
    activeDropdown = null;
  }
}

document.addEventListener('mousedown', e => {
  if (activeDropdown && !e.target.closest('.op-inline-dropdown') && !e.target.closest('.op-dropzone-empty')) closeOpDropdown();
});
document.addEventListener('touchstart', e => {
  if (activeDropdown && !e.target.closest('.op-inline-dropdown') && !e.target.closest('.op-dropzone-empty')) closeOpDropdown();
}, { passive: true });

// ── REMARKS ───────────────────────────────────────────────────────────────
function saveRemark(blockId, value) {
  blockRemarks[blockId + '_text'] = value;
  // Sync to ALL textareas in this block (desktop col + mobile panel)
  const el = document.getElementById(blockId);
  if (el) {
    el.querySelectorAll('.remarks-textarea').forEach(ta => {
      if (ta.value !== value) ta.value = value;
    });
  }
}

function toggleRemarksPanel(blockId) {
  // Single open state shared by both desktop and mobile panels
  blockRemarks[blockId + '_open'] = !blockRemarks[blockId + '_open'];
  const isOpen = blockRemarks[blockId + '_open'];
  // Apply to whichever panel is currently in the DOM
  ['_rem_d', '_rem_m'].forEach(suffix => {
    const panel = document.getElementById(blockId + suffix);
    if (panel) panel.classList.toggle('open', isOpen);
  });
}

// ── RENDER BLOCK ────────────────────────────────────────────────────────
function renderBlock(block) {
  const el = document.getElementById(block.id);
  if (!el) return;

  // Snapshot any live textarea value before wiping innerHTML
  el.querySelectorAll('.remarks-textarea').forEach(ta => {
    if (ta.value) blockRemarks[block.id + '_text'] = ta.value;
  });
  const meta = OP_META[block.op] || {};
  const isUnary = meta.unary;
  const result = getResult(block);

  const resBitsHTML = result !== null
    ? valToBits(result, block.bits).map((b, i) => {
        const pos = block.bits - 1 - i;
        return `<div class="bit-cell result-bit ${b?'on':''}" title="bit ${pos}">${b}</div>`;
      }).join('')
    : `<span style="font-size:11px;color:var(--text3)">waiting for operator</span>`;

  const hexRes = result !== null ? result.toString(16).toUpperCase().padStart(Math.ceil(block.bits/4),'0') : '??';
  const resVarId = block.resultVarId;
  const resVc = resVarId ? varColor(resVarId) : '';
  const resVName = (resVarId && variables[resVarId]) ? variables[resVarId].name : '';
  const isWaitingOp = tapPayload && tapPayload.type === 'op';
  const savedRemark = blockRemarks[block.id + '_text'] || '';

  const remarkTA = `<textarea class="remarks-textarea" placeholder="Add notes, remarks, observations…" oninput="saveRemark('${block.id}',this.value)">${savedRemark}</textarea>`;

  el.innerHTML = `
    <div class="calc-inner">
      <div class="calc-main-col">
        <div class="calc-ribbon">
          <span class="ribbon-label">op #${block.id.replace('blk_','')}</span>
          <div class="bits-ctrl">
            <label>bits</label>
            <input type="range" class="bits-slider" min="1" max="20" value="${block.bits}" oninput="setBits('${block.id}',this.value)">
            <span class="bits-val" id="${block.id}_bitsval">${block.bits}</span>
          </div>
          <div class="ribbon-spacer"></div>
          <button class="ribbon-del" title="delete block" onclick="deleteBlock('${block.id}')">×</button>
        </div>
        <div class="calc-body ${isUnary?'unary':''}">
          ${buildSlotHTML(block, 'a', 'A')}
          <div class="op-drop-zone" id="${block.id}_op_zone">
            ${block.op
              ? `<div class="op-placed op-${block.op}" onclick="clearOp('${block.id}')">
                   <div class="op-sym" style="color:${opColor(block.op)}">${meta.sym}</div>
                   <div class="op-clear">click to clear</div>
                 </div>`
              : `<div class="op-dropzone-empty ${isWaitingOp?'waiting-tap':''}" id="${block.id}_opdrop"
                   ondragover="opDragOver(event,'${block.id}')"
                   ondragleave="opDragLeave(event,'${block.id}')"
                   ondrop="opDrop(event,'${block.id}')"
                   onclick="openOpDropdown('${block.id}')">
                   ⊕
                   <span class="dz-hint">drop or click</span>
                 </div>`
            }
          </div>
          ${isUnary
            ? `<div class="calc-slot" style="opacity:0.15;pointer-events:none">
                 <div class="slot-label">B</div>
                 <div class="slot-dropzone"><div class="bit-strip"></div></div>
                 <div class="slot-dec">—</div>
               </div>`
            : buildSlotHTML(block, 'b', 'B')
          }
        </div>
        <div class="result-section">
          <div class="result-row" id="${block.id}_resultrow">
            <span class="result-label">RESULT</span>
            ${(resVarId && variables[resVarId]) ? `
              <div style="display:flex;align-items:center;gap:4px">
                <span class="slot-var-name ${resVc} draggable-result-label" draggable="true">${resVName}</span>
                <button class="slot-promote-btn" style="color:var(--red);border-color:rgba(244,63,94,0.2)" onclick="unlinkVar(event,'${block.id}','result')" title="Unlink">×</button>
              </div>` : ''}
            <div class="bit-strip">${resBitsHTML}</div>
            ${result !== null
              ? `<span class="result-dec">${result}</span><span class="result-hex">0x${hexRes}</span>`
              : `<span class="result-incomplete">—</span>`}
            <button class="slot-promote-btn" style="margin-left:auto" onclick="promoteSlot('${block.id}','result')">↑ promote result</button>
          </div>
        </div>
        <!-- Mobile remarks (bottom) -->
        <div class="remarks-mobile ${blockRemarks[block.id+'_open']?'open':''}" id="${block.id}_rem_m">
          <button class="remarks-toggle-btn" onclick="toggleRemarksPanel('${block.id}')">
            <span class="remarks-toggle-label">✎ remarks</span>
            <span class="remarks-chevron">▾</span>
          </button>
          <div class="remarks-body">${remarkTA}</div>
        </div>
      </div>
      <!-- Desktop remarks col (right side) -->
      <div class="remarks-col ${blockRemarks[block.id+'_open']?'open':''}" id="${block.id}_rem_d">
        <button class="remarks-toggle-btn" onclick="toggleRemarksPanel('${block.id}')">
          <span class="remarks-toggle-label">✎ remarks</span>
          <span class="remarks-chevron">▾</span>
        </button>
        <div class="remarks-body">${remarkTA}</div>
      </div>
    </div>`;

  // Re-attach drag listener on draggable result label
  const resLabel = el.querySelector('.draggable-result-label');
  if (resLabel) {
    resLabel.addEventListener('dragstart', e => {
      clearTapSelection();
      dragPayload = { type: 'var', varId: resVarId };
      e.dataTransfer.effectAllowed = 'copy';
    });
    resLabel.addEventListener('click', e => {
      e.stopPropagation();
      handleMobileTapSelection({ type: 'var', varId: resVarId }, resLabel);
    });
  }

  updateResultVar(block);
}

// ── ADD / DELETE BLOCK ──────────────────────────────────────────────────
function addBlock(op) {
  const canvas = document.getElementById('canvas');
  const noOpsEl = document.getElementById('no-ops');
  if (noOpsEl) noOpsEl.style.display = 'none';
  const block = makeBlock(op || null);
  if (!op) block.op = null;
  const el = document.createElement('div');
  el.className = 'calc-block';
  el.id = block.id;
  canvas.appendChild(el);
  renderBlock(block);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function deleteBlock(blockId) {
  blocks = blocks.filter(b => b.id !== blockId);
  // clean up remarks state
  Object.keys(blockRemarks).filter(k => k.startsWith(blockId)).forEach(k => delete blockRemarks[k]);
  document.getElementById(blockId)?.remove();
  if (!blocks.length) {
    const noOpsEl = document.getElementById('no-ops');
    if (noOpsEl) noOpsEl.style.display = '';
  }
}

// ── GLOBAL RESETS ───────────────────────────────────────────────────────
function clearAll() {
  blocks = [];
  variables = {};
  varCounter = 0;
  blockCounter = 0;
  clearTapSelection();
  Object.keys(nameCounters).forEach(k => delete nameCounters[k]);
  Object.keys(blockRemarks).forEach(k => delete blockRemarks[k]);
  const canvas = document.getElementById('canvas');
  if (canvas) canvas.innerHTML = `<div class="no-ops" id="no-ops">Drag/Tap an <b>operator</b> from the left panel<br>or click <b>+ operation</b> to start</div>`;
  renderVarPanel();
}

// ── BIT TOGGLE ──────────────────────────────────────────────────────────
function toggleBit(e, blockId, slot, pos) {
  e.stopPropagation();
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;
  const varId = slot === 'a' ? block.aVarId : block.bVarId;
  if (varId && variables[varId]) {
    variables[varId].value ^= (1 << pos);
    blocks.forEach(b => {
      if (b.aVarId === varId) redrawSlotBits(b, 'a');
      if (b.bVarId === varId) redrawSlotBits(b, 'b');
      if (b.aVarId === varId || b.bVarId === varId) redrawResult(b);
    });
    renderVarPanel();
  } else {
    if (slot === 'a') block.aVal ^= (1 << pos);
    else block.bVal ^= (1 << pos);
    redrawSlotBits(block, slot);
    redrawResult(block);
  }
  updateResultVar(block);
}

// ── SET BITS ─────────────────────────────────────────────────────────────
function setBits(blockId, val) {
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;
  const bits = parseInt(val);
  block.bits = bits;
  const mask = bits >= 32 ? 0xFFFFFFFF : (1 << bits) - 1;
  block.aVal &= mask;
  block.bVal &= mask;
  if (block.aVarId && variables[block.aVarId]) variables[block.aVarId].value &= mask;
  if (block.bVarId && variables[block.bVarId]) variables[block.bVarId].value &= mask;
  const bitsValEl = document.getElementById(blockId + '_bitsval');
  if (bitsValEl) bitsValEl.textContent = bits;
  redrawSlotBits(block, 'a');
  if (!block.unary) redrawSlotBits(block, 'b');
  redrawResult(block);
  updateResultVar(block);
}

function redrawSlotBits(block, slot) {
  const zone = document.getElementById(block.id + '_' + slot + '_zone');
  if (!zone) return;
  const val = getSlotValue(block, slot);
  const strip = zone.querySelector('.bit-strip');
  if (!strip) return;
  strip.innerHTML = valToBits(val, block.bits).map((b, i) => {
    const pos = block.bits - 1 - i;
    return `<div class="bit-cell ${b?'on':''}" onclick="toggleBit(event,'${block.id}','${slot}',${pos})">${b}</div>`;
  }).join('');
  const dec = zone.parentElement?.querySelector('.slot-dec');
  if (dec) dec.textContent = val + ' · 0x' + val.toString(16).toUpperCase().padStart(Math.ceil(block.bits/4),'0');
}

function redrawResult(block) {
  const resultRow = document.getElementById(block.id + '_resultrow');
  if (!resultRow) return;
  const result = getResult(block);
  const hexRes = result !== null ? result.toString(16).toUpperCase().padStart(Math.ceil(block.bits/4),'0') : '??';
  const strip = resultRow.querySelector('.bit-strip');
  if (strip) {
    strip.innerHTML = result !== null
      ? valToBits(result, block.bits).map((b, i) => {
          const pos = block.bits - 1 - i;
          return `<div class="bit-cell result-bit ${b?'on':''}" title="bit ${pos}">${b}</div>`;
        }).join('')
      : `<span style="font-size:11px;color:var(--text3)">waiting for operator</span>`;
  }
  const dec = resultRow.querySelector('.result-dec');
  if (dec && result !== null) dec.textContent = result;
  const hex = resultRow.querySelector('.result-hex');
  if (hex && result !== null) hex.textContent = '0x' + hexRes;
}

// ── CLEAR OP ─────────────────────────────────────────────────────────────
function clearOp(blockId) {
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;
  block.op = null;
  block.unary = false;
  renderBlock(block);
}

// ── TOUCH/CLICK SELECTION FALLBACK ───────────────────────────────────────
function handleMobileTapSelection(payload, element) {
  const wasAlreadySelected = tapPayload &&
    ((payload.type === 'op' && tapPayload.op === payload.op) ||
     (payload.type === 'var' && tapPayload.varId === payload.varId));
  clearTapSelection();
  if (!wasAlreadySelected) {
    tapPayload = payload;
    element.classList.add('selected-active');
    if (payload.type === 'op') {
      document.querySelectorAll('.op-dropzone-empty').forEach(el => el.classList.add('waiting-tap'));
    } else if (payload.type === 'var') {
      document.querySelectorAll('.slot-dropzone:not(.has-var)').forEach(el => el.classList.add('waiting-tap'));
    }
  }
}

function clearTapSelection() {
  tapPayload = null;
  document.querySelectorAll('.op-chip, .var-chip, .draggable-result-label').forEach(el => el.classList.remove('selected-active'));
  document.querySelectorAll('.waiting-tap').forEach(el => el.classList.remove('waiting-tap'));
}

function handleOpZoneTap(blockId) {
  if (tapPayload && tapPayload.type === 'op') {
    const block = blocks.find(b => b.id === blockId);
    if (block) {
      block.op = tapPayload.op;
      block.unary = OP_META[tapPayload.op]?.unary || false;
      clearTapSelection();
      renderBlock(block);
    }
  }
}

function handleSlotTap(blockId, slot) {
  if (tapPayload && tapPayload.type === 'var') {
    const block = blocks.find(b => b.id === blockId);
    if (!block) return;
    const vid = tapPayload.varId;
    if (!variables[vid]) return;
    if (block.resultVarId === vid) { flashInterlinkError(blockId); clearTapSelection(); return; }
    if (slot === 'a') { block.aVarId = vid; block.aVal = variables[vid].value; }
    else { block.bVarId = vid; block.bVal = variables[vid].value; }
    clearTapSelection();
    renderBlock(block);
  }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.op-chip') && !e.target.closest('.var-chip') &&
      !e.target.closest('.slot-dropzone') && !e.target.closest('.op-dropzone-empty') &&
      !e.target.closest('.draggable-result-label')) {
    clearTapSelection();
  }
});

// ── OPERATOR DRAG HANDLERS ──────────────────────────────────────────────
document.querySelectorAll('.op-chip').forEach(chip => {
  chip.addEventListener('dragstart', e => {
    clearTapSelection();
    dragPayload = { type: 'op', op: chip.dataset.op };
    chip.classList.add('dragging-source');
    e.dataTransfer.effectAllowed = 'copy';
  });
  chip.addEventListener('dragend', () => chip.classList.remove('dragging-source'));
  chip.addEventListener('click', e => {
    e.stopPropagation();
    handleMobileTapSelection({ type: 'op', op: chip.dataset.op }, chip);
  });
});

document.getElementById('canvas').addEventListener('dragover', e => {
  if (dragPayload?.type === 'op') e.preventDefault();
});
document.getElementById('canvas').addEventListener('drop', e => {
  if (dragPayload?.type !== 'op') return;
  const zone = e.target.closest('.op-dropzone-empty, .op-placed');
  if (zone) return;
  const blockEl = e.target.closest('.calc-block');
  if (!blockEl) { addBlock(dragPayload.op); dragPayload = null; }
});

function opDragOver(e, blockId) {
  if (dragPayload?.type === 'op') { e.preventDefault(); e.stopPropagation(); }
  document.getElementById(blockId + '_opdrop')?.classList.add('drag-over');
}
function opDragLeave(e, blockId) {
  document.getElementById(blockId + '_opdrop')?.classList.remove('drag-over');
}
function opDrop(e, blockId) {
  e.preventDefault(); e.stopPropagation();
  document.getElementById(blockId + '_opdrop')?.classList.remove('drag-over');
  if (dragPayload?.type !== 'op') return;
  const block = blocks.find(b => b.id === blockId);
  if (!block) return;
  block.op = dragPayload.op;
  block.unary = OP_META[dragPayload.op]?.unary || false;
  dragPayload = null;
  renderBlock(block);
}

function slotDragOver(e, blockId, slot) {
  if (dragPayload?.type === 'var') { e.preventDefault(); e.stopPropagation(); }
  document.getElementById(blockId + '_' + slot + '_zone')?.classList.add('drag-over');
}
function slotDragLeave(e, blockId, slot) {
  document.getElementById(blockId + '_' + slot + '_zone')?.classList.remove('drag-over');
}

document.addEventListener('dragend', () => { dragPayload = null; });

// ── MOBILE VARIABLES SIDEBAR (inline, no overlay) ────────────────────────
function toggleVarsSidebar() {
  document.getElementById('mobile-vars-sidebar')?.classList.toggle('open');
}

renderVarPanel();
</script>
</body>
</html>
